<svg xmlns="http://www.w3.org/2000/svg" width="467" height="251" viewBox="0 0 467 251" role="img" aria-labelledby="title desc"><title id="title">Cosipa&#x27;s public contribution stats</title><desc id="desc">Public commit contributions are eligible commits to public repositories, not every Git commit on every branch. Private counts are only anonymized totals published by GitHub.</desc><rect width="467" height="251" rx="5" fill="#232136"/><g font-family="Verdana,DejaVu Sans,sans-serif"><rect x=".5" y=".5" width="466" height="250" rx="5" fill="none" stroke="#44415a"/><path d="M20 23V49" stroke="#c4a7e7" stroke-width="4" stroke-linecap="round"/><text x="33" y="32" fill="#e0def4" font-size="18" text-anchor="start" font-weight="bold">Cosipa&#x27;s GitHub stats</text><text x="33" y="52" fill="#b8b5ce" font-size="11" text-anchor="start" font-weight="normal">2026 YTD through 2026-11-11 (UTC)</text><rect x="16" y="67" width="435" height="26" rx="4" fill="#2a273f"/><circle cx="28" cy="80" r="3" fill="#c4a7e7"/><text x="40" y="84" fill="#b8b5ce" font-size="11" text-anchor="start" font-weight="normal">Public commit contributions</text><text x="439" y="84" fill="#c4a7e7" font-size="12" text-anchor="end" font-weight="bold">64</text><rect x="16" y="96" width="435" height="26" rx="4" fill="#2a273f"/><circle cx="28" cy="109" r="3" fill="#9ccfd8"/><text x="40" y="113" fill="#b8b5ce" font-size="11" text-anchor="start" font-weight="normal">Public PRs opened</text><text x="439" y="113" fill="#9ccfd8" font-size="12" text-anchor="end" font-weight="bold">3</text><rect x="16" y="125" width="435" height="26" rx="4" fill="#2a273f"/><circle cx="28" cy="138" r="3" fill="#eb6f92"/><text x="40" y="142" fill="#b8b5ce" font-size="11" text-anchor="start" font-weight="normal">Public issues opened</text><text x="439" y="142" fill="#eb6f92" font-size="12" text-anchor="end" font-weight="bold">1</text><rect x="16" y="154" width="435" height="26" rx="4" fill="#2a273f"/><circle cx="28" cy="167" r="3" fill="#9ccfd8"/><text x="40" y="171" fill="#b8b5ce" font-size="11" text-anchor="start" font-weight="normal">Public PR reviews</text><text x="439" y="171" fill="#9ccfd8" font-size="12" text-anchor="end" font-weight="bold">1</text><rect x="16" y="183" width="435" height="26" rx="4" fill="#2a273f"/><circle cx="28" cy="196" r="3" fill="#c4a7e7"/><text x="40" y="200" fill="#b8b5ce" font-size="11" text-anchor="start" font-weight="normal">Published restricted contributions</text><text x="439" y="200" fill="#c4a7e7" font-size="12" text-anchor="end" font-weight="bold">834</text><text x="20" y="236" fill="#b8b5ce" font-size="10" text-anchor="start" font-weight="normal">Restricted private activity: all types, not just commits.</text></g></svg>
