<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Cosipa — profile laboratory, dark theme</title>
  <desc id="desc">A dark terminal-inspired banner with a glowing orbital illustration.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101727"/><stop offset="1" stop-color="#24243f"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>
  <g font-family="monospace"><text x="48" y="62" fill="#9ece6a" font-size="15">~/cosipa $ ./introduce-yourself</text><text x="48" y="132" fill="#c0caf5" font-size="54" font-weight="bold">Hello, I'm Cosipa.</text><text x="48" y="176" fill="#a9b1d6" font-size="19">Build things. Break things. Understand things.</text><text x="48" y="224" fill="#7aa2f7" font-size="13">PROFILE LAB // EVERYTHING IS OPTIONAL</text></g>
  <g transform="translate(856 130)" fill="none" stroke="url(#accent)" stroke-width="2"><ellipse rx="88" ry="32" transform="rotate(-35)"/><ellipse rx="88" ry="32" transform="rotate(35)"/><circle r="46"/><circle r="13" fill="#bb9af7" stroke="none"/><circle cx="72" cy="-45" r="5" fill="#7dcfff" stroke="none"/></g>
</svg>
