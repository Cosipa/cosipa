<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
  <title id="title">Community Connect Four concept</title><desc id="desc">A noninteractive sample game board. A real integration would accept moves through GitHub issues.</desc>
  <rect width="760" height="370" rx="14" fill="#1a1b26"/>
  <g font-family="monospace"><text x="30" y="49" fill="#c0caf5" font-size="25">README vs. the internet</text><text x="30" y="83" fill="#e0af68" font-size="13">CONNECT FOUR / VISUAL MOCKUP ONLY</text><text x="30" y="156" fill="#a9b1d6" font-size="15">Visitors open an issue</text><text x="30" y="183" fill="#a9b1d6" font-size="15">to choose their next move.</text><text x="30" y="235" fill="#7aa2f7" font-size="15">Issue → Action → SVG</text><text x="30" y="305" fill="#565f89" font-size="12">No game or workflow is enabled.</text></g>
  <rect x="405" y="45" width="326" height="280" rx="12" fill="#33457c"/>
  <defs><pattern id="holes" x="420" y="60" width="43" height="43" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="15" fill="#1a1b26"/></pattern></defs>
  <rect x="420" y="60" width="301" height="258" fill="url(#holes)"/>
  <g fill="#f7768e"><circle cx="481" cy="293" r="15"/><circle cx="524" cy="250" r="15"/><circle cx="567" cy="207" r="15"/></g>
  <g fill="#e0af68"><circle cx="524" cy="293" r="15"/><circle cx="567" cy="293" r="15"/><circle cx="567" cy="250" r="15"/></g>
</svg>
