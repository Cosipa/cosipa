<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">A terminal-style profile mockup</title>
  <desc id="desc">Example introduction, projects, and status rendered as shell output. The cursor blinks.</desc>
  <rect width="900" height="350" rx="14" fill="#1a1b26"/><path d="M14 0H886Q900 0 900 14V40H0V14Q0 0 14 0" fill="#24283b"/>
  <circle cx="24" cy="20" r="6" fill="#f7768e"/><circle cx="45" cy="20" r="6" fill="#e0af68"/><circle cx="66" cy="20" r="6" fill="#9ece6a"/>
  <text x="450" y="25" text-anchor="middle" fill="#a9b1d6" font-size="13" font-family="monospace">cosipa@github: ~</text>
  <g font-family="monospace" font-size="17"><text x="30" y="79" fill="#9ece6a">❯ whoami</text><text x="30" y="109" fill="#c0caf5">Cosipa — builder / tinkerer / professional tab collector</text><text x="30" y="154" fill="#9ece6a">❯ cat interests.txt</text><text x="30" y="184" fill="#7dcfff">[ demo ] Linux · automation · open source · side quests</text><text x="30" y="229" fill="#9ece6a">❯ systemctl status motivation</text><text x="30" y="259" fill="#c0caf5">● active (occasionally distracted)</text><text x="30" y="315" fill="#9ece6a">❯</text></g>
  <rect x="53" y="299" width="10" height="20" fill="#c0caf5"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.2s" repeatCount="indefinite"/></rect>
</svg>
