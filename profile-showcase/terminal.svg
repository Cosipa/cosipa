<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="328" viewBox="0 0 1000 328" role="img" aria-labelledby="title desc">
  <title id="title">Cosipa's terminal styling — Rosé Pine Moon and Fish with Starship</title>
  <desc id="desc">A styling recreation based on the terminal and Starship configuration in NixOS. No window chrome. Two-line prompts, Rosé Pine Moon colors, and a steady beam cursor. Demonstration commands show the public profile repository and RSS URL, not a terminal screenshot.</desc>
  <rect width="1000" height="328" fill="#232136"/>
  <g font-family="'ZedMono NF', 'IosevkaTerm NFP', monospace" font-size="18" xml:space="preserve">
    <text x="24" y="38"><tspan fill="#6e6a86">╭─ </tspan><tspan fill="#e0def4" font-weight="bold">~/cosipa </tspan><tspan fill="#9ccfd8">── main</tspan></text>
    <text x="24" y="65"><tspan fill="#6e6a86">╰─</tspan><tspan fill="#9ccfd8" font-weight="bold">› </tspan><tspan fill="#c4a7e7">git </tspan><tspan fill="#ea9a97">remote get-url origin</tspan></text>
    <text x="24" y="98" fill="#e0def4">git@github.com:Cosipa/cosipa.git</text>
    <text x="24" y="158"><tspan fill="#6e6a86">╭─ </tspan><tspan fill="#e0def4" font-weight="bold">~/cosipa </tspan><tspan fill="#9ccfd8">── main</tspan></text>
    <text x="24" y="185"><tspan fill="#6e6a86">╰─</tspan><tspan fill="#9ccfd8" font-weight="bold">› </tspan><tspan fill="#c4a7e7">printf </tspan><tspan fill="#f6c177">'%s\n' </tspan><tspan fill="#ea9a97">https://cosipa.dev/rss</tspan></text>
    <text x="24" y="218" fill="#e0def4">https://cosipa.dev/rss</text>
    <text x="24" y="278"><tspan fill="#6e6a86">╭─ </tspan><tspan fill="#e0def4" font-weight="bold">~/cosipa </tspan><tspan fill="#9ccfd8">── main</tspan></text>
    <text x="24" y="305"><tspan fill="#6e6a86">╰─</tspan><tspan fill="#9ccfd8" font-weight="bold">›</tspan></text>
  </g>
  <path d="M63 288v21" stroke="#e0def4" stroke-width="2"/>
</svg>
