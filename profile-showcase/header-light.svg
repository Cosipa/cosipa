<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Cosipa — profile laboratory, light theme</title>
  <desc id="desc">A pale terminal-inspired banner with a blue and purple orbital illustration.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eff4ff"/><stop offset="1" stop-color="#f2edff"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#3458b8"/><stop offset="1" stop-color="#7843b8"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24345c" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>
  <g font-family="monospace"><text x="48" y="62" fill="#326b2c" font-size="15">~/cosipa $ ./introduce-yourself</text><text x="48" y="132" fill="#24345c" font-size="54" font-weight="bold">Hello, I'm Cosipa.</text><text x="48" y="176" fill="#4c5674" font-size="19">Build things. Break things. Understand things.</text><text x="48" y="224" fill="#3458b8" font-size="13">PROFILE LAB // EVERYTHING IS OPTIONAL</text></g>
  <g transform="translate(856 130)" fill="none" stroke="url(#accent)" stroke-width="2"><ellipse rx="88" ry="32" transform="rotate(-35)"/><ellipse rx="88" ry="32" transform="rotate(35)"/><circle r="46"/><circle r="13" fill="#7843b8" stroke="none"/><circle cx="72" cy="-45" r="5" fill="#3458b8" stroke="none"/></g>
</svg>
