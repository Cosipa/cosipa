<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
  <title id="title">Now-playing card mockup</title><desc id="desc">Illustrative music card with animated equalizer bars. Not connected to a music account.</desc>
  <defs><linearGradient id="cover" x2="1" y2="1"><stop stop-color="#bb9af7"/><stop offset="1" stop-color="#2ac3de"/></linearGradient></defs>
  <rect width="640" height="190" rx="14" fill="#161b22"/><rect x="22" y="25" width="140" height="140" rx="10" fill="url(#cover)"/>
  <circle cx="92" cy="95" r="47" fill="#161b22" fill-opacity=".8"/><circle cx="92" cy="95" r="14" fill="#c0caf5"/><circle cx="92" cy="95" r="4" fill="#161b22"/>
  <g font-family="sans-serif"><text x="188" y="47" fill="#3ddc84" font-size="12" letter-spacing="2">NOW PLAYING · DEMO</text><text x="188" y="85" fill="#f0f6fc" font-size="25" font-weight="bold">Music to refactor to</text><text x="188" y="113" fill="#8b949e" font-size="16">Your favorite artist · Your favorite album</text><text x="188" y="158" fill="#8b949e" font-size="11">1:42</text><text x="558" y="158" fill="#8b949e" font-size="11">4:08</text></g>
  <rect x="188" y="132" width="400" height="4" rx="2" fill="#30363d"/><rect x="188" y="132" width="165" height="4" rx="2" fill="#3ddc84"/>
  <g fill="#3ddc84"><rect x="573" y="47" width="5" height="20"><animate attributeName="height" values="20;8;20" dur=".8s" repeatCount="indefinite"/></rect><rect x="583" y="47" width="5" height="10"><animate attributeName="height" values="10;25;10" dur="1.1s" repeatCount="indefinite"/></rect><rect x="593" y="47" width="5" height="15"><animate attributeName="height" values="15;5;15" dur=".7s" repeatCount="indefinite"/></rect></g>
</svg>
