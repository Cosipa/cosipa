name: Validate profile generation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "README.md"
      - ".python-version"
      - "renovate.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: Test generators and validate profile assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Run profile generator tests
        run: python -m unittest discover -s src/scripts/tests -v
      - name: Validate README regions and SVG assets
        run: python src/scripts/update_profile.py --check
