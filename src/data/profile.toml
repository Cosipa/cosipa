username = "Cosipa"
repository = "Cosipa/cosipa"
markdown = "README.md"
regions = ["typing", "pgp", "posts47", "activity", "merged", "stats", "timeline", "snake", "quote"]
# Refresh only the unused options left in the component catalogue.
showcase_markdown = "src/showcase.md"
showcase_regions = ["github-badges", "posts48a", "posts48b", "repository-placeholder", "footer"]
generated_dir = "src/assets/generated"
cache = "src/data/public.json"
quotes = "src/data/quotes.txt"

[blog]
feed = "https://cosipa.dev/rss"
rows = 3
excerpts = 3

