<svg xmlns="http://www.w3.org/2000/svg" width="467" height="229" viewBox="0 0 467 229" role="img" aria-labelledby="title desc">
  <title id="title">Cosipa&#x27;s public contribution stats</title>
  <desc id="desc">Public commit contributions are eligible commits to public repositories, not every Git commit on every branch. Private counts are only anonymized totals published by GitHub.</desc>
  <rect width="467" height="229" rx="5" fill="#0d1117"/>
  <g font-family="Verdana,DejaVu Sans,sans-serif">
<text x="20" y="30" fill="#58a6ff" font-size="18" text-anchor="start" font-weight="normal">Cosipa&#x27;s GitHub stats</text>
<text x="20" y="52" fill="#8b949e" font-size="11" text-anchor="start" font-weight="normal">2026 YTD through 2026-11-12 (UTC)</text>
<text x="20" y="82" fill="#8b949e" font-size="12" text-anchor="start" font-weight="normal">Public commit contributions</text>
<text x="445" y="82" fill="#58a6ff" font-size="12" text-anchor="end" font-weight="normal">98</text>
<text x="20" y="105" fill="#8b949e" font-size="12" text-anchor="start" font-weight="normal">Public PRs opened</text>
<text x="445" y="105" fill="#58a6ff" font-size="12" text-anchor="end" font-weight="normal">3</text>
<text x="20" y="128" fill="#8b949e" font-size="12" text-anchor="start" font-weight="normal">Public issues opened</text>
<text x="445" y="128" fill="#58a6ff" font-size="12" text-anchor="end" font-weight="normal">1</text>
<text x="20" y="151" fill="#8b949e" font-size="12" text-anchor="start" font-weight="normal">Public PR reviews</text>
<text x="445" y="151" fill="#58a6ff" font-size="12" text-anchor="end" font-weight="normal">1</text>
<text x="20" y="174" fill="#8b949e" font-size="12" text-anchor="start" font-weight="normal">Published restricted contributions</text>
<text x="445" y="174" fill="#58a6ff" font-size="12" text-anchor="end" font-weight="normal">842</text>
<text x="20" y="211" fill="#8b949e" font-size="10" text-anchor="start" font-weight="normal">Restricted private activity: all types, not just commits.</text>

  </g>
</svg>
