<svg xmlns="http://www.w3.org/2000/svg" width="600" height="117" viewBox="0 0 600 117" role="img" aria-labelledby="title desc">
  <title id="title">Quote from quotes.txt</title>
  <desc id="desc">A computer is like air conditioning – it becomes useless when you open Windows — Linus Torvalds</desc>
  <rect width="600" height="117" rx="5" fill="#ffffff"/>
  <g font-family="Verdana,DejaVu Sans,sans-serif">
<path d="M22 20V97" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
<text x="35" y="56" fill="#0969da" font-size="42" text-anchor="start" font-weight="normal">“</text>

<g font-style="italic">
<text x="62" y="42" fill="#24292f" font-size="15" text-anchor="start" font-weight="normal">A computer is like air conditioning – it becomes useless</text>
<text x="62" y="65" fill="#24292f" font-size="15" text-anchor="start" font-weight="normal">when you open Windows”</text>

</g>
<text x="62" y="93" fill="#57606a" font-size="12" text-anchor="start" font-weight="normal">— Linus Torvalds</text>


  </g>
</svg>
